openapi: 3.2.0
info:
  title: Ingest Tags API
  description: Public API for importing data and managing labeling tasks, cases, projects, and assets.
  version: 0.1.0
servers:
- url: https://api.centaurlabs.com
tags:
- name: Tags
  description: Organize cases and assets by applying, removing, and listing tags.
paths:
  /tags/public/v1/add:
    post:
      tags:
      - Tags
      summary: Public Add Tag
      description: Adds a tag to one or more cases in a task, optionally filtered by import or explicit case IDs.
      operationId: public_add_tag_tags_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTagRequest'
              examples:
              - tag: all_cases_in_task
                task_id: 123
              - tag: all_cases_for_import
                task_id: 123
                import_id: 456
              - tag: specific_problem_ids
                task_id: 123
                problem_ids:
                - 456
                - 789
                - 101
              - tag: specific_problem_ids_in_import
                task_id: 123
                import_id: 456
                problem_ids:
                - 789
                - 101
                - 213
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /tags/public/v1/asset/add:
    post:
      tags:
      - Tags
      summary: Public Add Asset Tag
      description: Adds a category tag to a single asset.
      operationId: public_add_asset_tag_tags_public_v1_asset_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssetTagRequest'
              examples:
              - tag: primary_finding
                project_id: 123
                asset_ids:
                - 456
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /tags/public/v1/asset/delete:
    delete:
      tags:
      - Tags
      summary: Public Remove Asset Tag
      description: Removes a category tag from a single asset.
      operationId: public_remove_asset_tag_tags_public_v1_asset_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: tag
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
          title: Tag
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: asset_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
          minItems: 1
          unique_items: true
          title: Asset Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tags/public/v1/asset/list:
    get:
      tags:
      - Tags
      summary: Public List Asset Tags
      description: Returns the active category tags for a single asset.
      operationId: public_list_asset_tags_tags_public_v1_asset_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: asset_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Asset Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetTagsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tags/public/v1/delete:
    delete:
      tags:
      - Tags
      summary: Public Remove Tag
      description: Removes a tag from one or more cases in a task, optionally filtered by import or explicit case IDs.
      operationId: public_remove_tag_tags_public_v1_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: tag
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
          title: Tag
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
      - name: problem_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
              exclusiveMinimum: 0
            unique_items: true
            minLength: 1
          - type: 'null'
          title: Problem Ids
      - name: import_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tags/public/v1/list:
    get:
      tags:
      - Tags
      summary: Public List Tags
      description: Returns a paginated list of tags for the organization, optionally filtered by project or task.
      operationId: public_list_tags_tags_public_v1_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: last_sequence_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Last Sequence Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Organization Id
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Project Id
      - name: task_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ListTagsResponse:
      properties:
        payload:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
          title: Payload
        limit:
          type: integer
          title: Limit
        has_next:
          type: boolean
          title: Has Next
      type: object
      required:
      - payload
      - limit
      - has_next
      title: ListTagsResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AddTagRequest:
      properties:
        tag:
          type: string
          maxLength: 60
          minLength: 1
          title: Tag
        task_id:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
        problem_ids:
          anyOf:
          - items:
              type: integer
              exclusiveMinimum: 0
            type: array
            minLength: 1
            unique_items: true
          - type: 'null'
          title: Problem Ids
        import_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Import Id
      type: object
      required:
      - tag
      - task_id
      title: AddTagRequest
    Tag:
      properties:
        organization_id:
          type: integer
          title: Organization Id
        tag_id:
          type: integer
          title: Tag Id
        tag:
          type: string
          title: Tag
      type: object
      required:
      - organization_id
      - tag_id
      - tag
      title: Tag
    ListAssetTagsResponse:
      properties:
        payload:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
          title: Payload
      type: object
      required:
      - payload
      title: ListAssetTagsResponse
    AddAssetTagRequest:
      properties:
        tag:
          type: string
          maxLength: 60
          minLength: 1
          title: Tag
        project_id:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
        asset_ids:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          minItems: 1
          title: Asset Ids
          unique_items: true
      type: object
      required:
      - tag
      - project_id
      - asset_ids
      title: AddAssetTagRequest
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Your Centaur API key
      in: header
      name: X-API-KEY
    BearerToken:
      type: http
      description: Bearer token obtained from authentication endpoint
      scheme: bearer
