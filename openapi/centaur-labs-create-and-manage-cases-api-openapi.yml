openapi: 3.2.0
info:
  title: Ingest Create and Manage Cases API
  description: Public API for importing data and managing labeling tasks, cases, projects, and assets.
  version: 0.1.0
servers:
- url: https://api.centaurlabs.com
tags:
- name: Create and Manage Cases
  description: Create, duplicate, update, and delete the individual cases that labelers work on.
paths:
  /cases/custom/v1/update:
    patch:
      tags:
      - Create and Manage Cases
      summary: Update Case
      description: Updates properties of an existing case, including answers, notes, explanations, and frame assets.
      operationId: update_problem_cases_custom_v1_update_patch
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: query_params
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/UpdateProblemRequest'
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseExistingProblem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            examples:
              problem_update_example:
                summary: Problem Update Example
                value:
                  problem_id: 123
                  problem_properties:
                    pre_answer_explainer: Updated explainer text
                    internal_notes: Updated internal notes
                    problem_explanation: Updated explanation
                  answers:
                  - new_option1
                  - new_option2
                  - new_option3
                  frames:
                  - frame_id: 1
                    frame_asset:
                    - view_order: 0
                      text_highlight:
                      - - 0
                        - 15
                      - - 25
                        - 40
  /cases/public/v1/delete:
    delete:
      tags:
      - Create and Manage Cases
      summary: Delete a case from a task
      description: Deletes a specific case from a task by task ID and case ID.
      operationId: delete_case_cases_public_v1_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      - name: case_id
        in: query
        required: true
        schema:
          type: integer
          description: Case ID
          title: Case Id
        description: Case ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/public/v1/duplicate:
    post:
      tags:
      - Create and Manage Cases
      summary: Duplicate one or more cases from a task
      description: Duplicates cases from a source task into a target task, optionally copying gold standards and labels.
      operationId: handler_duplicate_case_cases_public_v1_duplicate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCaseFields'
              examples:
              - project_id: 123
                source_task_id: 789
                target_task_id: 101
                case_ids:
                - 201
                - 202
                copy_pre_answer_explainers: true
                copy_patches: true
                copy_gold_standards: true
                copy_internal_notes: true
                copy_explanations: true
                copy_tags: true
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Duplicate Case Cases Public V1 Duplicate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /tasks/assets/public/v1/add:
    post:
      tags:
      - Create and Manage Cases
      summary: Add a single asset to a task
      description: Creates a case for a single asset in a task, identified by content ID or origin.
      operationId: add_asset_to_task_tasks_assets_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssetToTaskBody'
              examples:
              - task_id: 123
                content_id: 456
              - task_id: 789
                origin: scan_001.dcm
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAssetToTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /tasks/imports/public/v1/add:
    post:
      tags:
      - Create and Manage Cases
      summary: Add imports to a task
      description: Adds one or more imports to a task, creating cases for all assets in those imports.
      operationId: add_imports_to_task_public_tasks_imports_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddImportsToTaskBody'
              examples:
              - task_id: 123
                import_ids:
                - 456
                - 789
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
components:
  schemas:
    ProblemExplanation:
      properties:
        explanation:
          type: string
          title: Explanation
        created_by_customer_id:
          type: integer
          title: Created By Customer Id
      additionalProperties: false
      type: object
      required:
      - explanation
      - created_by_customer_id
      title: ProblemExplanation
    ProblemLabelingState:
      type: string
      enum:
      - canceled
      - user_flagged
      - active
      - qa
      - silver_standard
      - unresolved
      - ignore
      - ready
      - done
      - on_deck
      - ready_gold_standard
      - gold_standard
      title: ProblemLabelingState
      description: 'The labeling states a problem can be in.


        games.labeling_states also carries a `tutorial` row, which is retired and deliberately

        not modelled here. The sync test asserts it is the only such state, so a genuinely new

        one fails CI rather than going unnoticed.'
    AddAssetToTaskResponse:
      properties:
        case_id:
          type: integer
          exclusiveMinimum: 0
          title: Case Id
      type: object
      required:
      - case_id
      title: AddAssetToTaskResponse
    DatabaseProblemAsset:
      properties:
        project_id:
          type: integer
          title: Project Id
        asset_id:
          type: integer
          title: Asset Id
        text_highlight:
          anyOf:
          - items:
              prefixItems:
              - type: integer
                minimum: 0
              - type: integer
                minimum: 0
              type: array
              maxItems: 2
              minItems: 2
            type: array
            unique_items: true
          - type: 'null'
          title: Text Highlight
        slice:
          anyOf:
          - $ref: '#/components/schemas/DatabaseAssetSlice'
          - type: 'null'
        asset_tags:
          anyOf:
          - items:
              $ref: '#/components/schemas/AssetTags'
            type: array
            minLength: 1
            unique_items: true
          - type: 'null'
          title: Asset Tags
        view_order:
          type: integer
          title: View Order
      type: object
      required:
      - project_id
      - asset_id
      - view_order
      title: DatabaseProblemAsset
    DatabaseFrame:
      properties:
        is_target:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Target
        frame_asset:
          items:
            $ref: '#/components/schemas/DatabaseProblemAsset'
          type: array
          minItems: 1
          title: Frame Asset
          unique_items: true
        frame_id:
          type: integer
          title: Frame Id
        answers:
          anyOf:
          - items:
              $ref: '#/components/schemas/AnswerClass'
            type: array
            maxLength: 20
            unique_items: true
          - type: 'null'
          title: Answers
      type: object
      required:
      - frame_asset
      - frame_id
      title: DatabaseFrame
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AddAssetToTaskBody:
      properties:
        task_id:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
        content_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Content Id
        origin:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin
      type: object
      required:
      - task_id
      title: AddAssetToTaskBody
    DatabaseAssetSlice:
      properties:
        slicing_recipe_id:
          type: integer
          title: Slicing Recipe Id
        slice_boundaries:
          prefixItems:
          - type: integer
            minimum: 0
          - type: integer
            minimum: 0
          type: array
          maxItems: 2
          minItems: 2
          title: Slice Boundaries
        slice_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slice Id
      additionalProperties: false
      type: object
      required:
      - slicing_recipe_id
      - slice_boundaries
      title: DatabaseAssetSlice
    ProblemParent:
      properties:
        parent_topic_id:
          type: integer
          title: Parent Topic Id
        parent_problem_id:
          type: integer
          title: Parent Problem Id
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      required:
      - parent_topic_id
      - parent_problem_id
      title: ProblemParent
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DatabaseProblemProperties:
      properties:
        pre_answer_explainer:
          anyOf:
          - type: string
          - type: 'null'
          title: Pre Answer Explainer
        internal_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Internal Notes
        patch:
          anyOf:
          - type: string
          - type: 'null'
          title: Patch
        problem_explanation:
          anyOf:
          - $ref: '#/components/schemas/ProblemExplanation'
          - type: 'null'
        labeling_state:
          $ref: '#/components/schemas/ProblemLabelingState'
          default: on_deck
      type: object
      title: DatabaseProblemProperties
    DuplicateCaseFields:
      properties:
        project_id:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
        source_task_id:
          type: integer
          exclusiveMinimum: 0
          title: Source Task Id
        target_task_id:
          type: integer
          exclusiveMinimum: 0
          title: Target Task Id
        case_ids:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          maxItems: 20000
          minItems: 0
          title: Case Ids
          unique_items: true
        copy_pre_answer_explainers:
          type: boolean
          title: Copy Pre Answer Explainers
          default: false
        copy_patches:
          type: boolean
          title: Copy Patches
          default: true
        copy_gold_standards:
          type: boolean
          title: Copy Gold Standards
          default: false
        copy_internal_notes:
          type: boolean
          title: Copy Internal Notes
          default: false
        copy_explanations:
          type: boolean
          title: Copy Explanations
          default: false
        copy_tags:
          type: boolean
          title: Copy Tags
          default: false
        copy_slicing_recipes:
          type: boolean
          title: Copy Slicing Recipes
          default: true
      type: object
      required:
      - project_id
      - source_task_id
      - target_task_id
      - case_ids
      title: DuplicateCaseFields
    AnswerClass:
      additionalProperties: true
      type: object
    ProblemTags:
      properties:
        tag_text:
          type: string
          title: Tag Text
        customer_data_tag_id:
          type: integer
          title: Customer Data Tag Id
        organization_id:
          type: integer
          title: Organization Id
        problem_tag_created_by_customer_id:
          type: integer
          title: Problem Tag Created By Customer Id
        tag_created_by_customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tag Created By Customer Id
      additionalProperties: false
      type: object
      required:
      - tag_text
      - customer_data_tag_id
      - organization_id
      - problem_tag_created_by_customer_id
      title: ProblemTags
    DatabaseExistingProblem:
      properties:
        problem_parent:
          anyOf:
          - $ref: '#/components/schemas/ProblemParent'
          - type: 'null'
        problem_properties:
          $ref: '#/components/schemas/DatabaseProblemProperties'
        frames:
          items:
            $ref: '#/components/schemas/DatabaseFrame'
          type: array
          minItems: 1
          title: Frames
          unique_items: true
        problem_tags:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemTags'
            type: array
            minLength: 1
            unique_items: true
          - type: 'null'
          title: Problem Tags
        topic_id:
          type: integer
          title: Topic Id
        problem_id:
          type: integer
          title: Problem Id
      type: object
      required:
      - frames
      - topic_id
      - problem_id
      title: DatabaseExistingProblem
    AssetTags:
      properties:
        tag_text:
          type: string
          title: Tag Text
        customer_data_tag_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Customer Data Tag Id
        organization_id:
          type: integer
          title: Organization Id
        asset_tag_created_by_customer_id:
          type: integer
          title: Asset Tag Created By Customer Id
        tag_created_by_customer_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tag Created By Customer Id
      additionalProperties: false
      type: object
      required:
      - tag_text
      - organization_id
      - asset_tag_created_by_customer_id
      title: AssetTags
    AddImportsToTaskBody:
      properties:
        task_id:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
        import_ids:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          minItems: 1
          title: Import Ids
          unique_items: true
        ignore_gaps:
          type: boolean
          title: Ignore Gaps
          default: false
      type: object
      required:
      - task_id
      - import_ids
      title: AddImportsToTaskBody
    UpdateProblemRequest:
      properties:
        task_id:
          type: integer
          title: Task Id
        force_action:
          anyOf:
          - type: string
            enum:
            - wipe
            - preserve
          - type: 'null'
          title: Force Action
      type: object
      required:
      - task_id
      title: UpdateProblemRequest
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Your Centaur API key
      in: header
      name: X-API-KEY
    BearerToken:
      type: http
      description: Bearer token obtained from authentication endpoint
      scheme: bearer
