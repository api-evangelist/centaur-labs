openapi: 3.2.0
info:
  title: Ingest Add and Manage Tasks API
  description: Public API for importing data and managing labeling tasks, cases, projects, and assets.
  version: 0.1.0
servers:
- url: https://api.centaurlabs.com
tags:
- name: Add and Manage Tasks
  description: Create and configure labeling tasks, including their answer classes, label class groups, and instructions.
paths:
  /answers/public/v1/add:
    post:
      tags:
      - Add and Manage Tasks
      summary: Handler Add Answer Legacy
      description: 'Deprecated: use /labelClasses/public/v1/add instead. Adds answer classes to a task.'
      operationId: handler_add_answer_legacy_answers_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnswerRequest'
              examples:
              - task_id: 456
                new_answers:
                - benign
                - malignant
                force: true
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LabelClassValueLegacy'
                type: array
                title: Response Handler Add Answer Legacy Answers Public V1 Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /answers/public/v1/delete:
    delete:
      tags:
      - Add and Manage Tasks
      summary: Handler Delete Answer Legacy
      description: 'Deprecated: use /labelClasses/public/v1/delete instead. Removes an answer class from a task.'
      operationId: handler_delete_answer_legacy_answers_public_v1_delete_delete
      deprecated: true
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      - name: answer
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
          title: Answer
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Delete Answer Legacy Answers Public V1 Delete Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /answers/public/v1/update:
    patch:
      tags:
      - Add and Manage Tasks
      summary: Update Label Classes
      description: Updates the name of an existing answer class on a task.
      operationId: update_label_classes_answers_public_v1_update_patch
      deprecated: true
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnswerBody'
              examples:
              - answer: old_label
                new_answer: updated_label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLabelClassResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /labelClasses/public/v1/add:
    post:
      tags:
      - Add and Manage Tasks
      summary: Handler Add Answer
      description: Adds one or more answer classes to a task, optionally replacing existing ones.
      operationId: handler_add_answer_labelClasses_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnswerRequest'
              examples:
              - task_id: 456
                new_answers:
                - benign
                - malignant
                force: true
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LabelClassValue'
                type: array
                title: Response Handler Add Answer Labelclasses Public V1 Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /labelClasses/public/v1/delete:
    delete:
      tags:
      - Add and Manage Tasks
      summary: Handler Delete Answer
      description: Removes a specific answer class from a task by task ID and answer value.
      operationId: handler_delete_answer_labelClasses_public_v1_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      - name: answer
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
          title: Answer
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /labelClasses/public/v1/groups:
    post:
      tags:
      - Add and Manage Tasks
      summary: Add a new label class group
      description: Creates a new label class group for a task with a prompt and initial answer class IDs.
      operationId: handler_add_label_class_group_labelClasses_public_v1_groups_post
      security:
      - APIKeyHeader: []
      - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLabelClassGroupRequest'
              examples:
              - task_id: 456
                prompt: prompt text
                multi_answer: true
                label_class_ids:
                - 1
                - 2
                - 3
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLabelClassGroupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Add and Manage Tasks
      summary: List all label class groups for a task
      description: Returns all label class groups associated with a specific task.
      operationId: handler_list_label_class_groups_labelClasses_public_v1_groups_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetLabelClassGroupResponse'
                title: Response Handler List Label Class Groups Labelclasses Public V1 Groups Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /labelClasses/public/v1/groups/reorder:
    put:
      tags:
      - Add and Manage Tasks
      summary: Reorder the label class groups for a task
      description: Reorders the label class groups for a task by providing the desired order of group IDs.
      operationId: handler_reorder_label_class_groups_labelClasses_public_v1_groups_reorder_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderLabelClassGroupsBody'
              examples:
              - task_id: 456
                new_label_class_groups_order:
                - 1
                - 2
                - 3
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Reorder Label Class Groups Labelclasses Public V1 Groups Reorder Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /labelClasses/public/v1/groups/{label_class_group_id}:
    delete:
      tags:
      - Add and Manage Tasks
      summary: Delete a label class group
      description: All answers in the label class group will be ungrouped
      operationId: handler_delete_label_class_group_labelClasses_public_v1_groups__label_class_group_id__delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: label_class_group_id
        in: path
        required: true
        schema:
          type: integer
          description: Label Class Group ID
          title: Label Class Group Id
        description: Label Class Group ID
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Delete Label Class Group Labelclasses Public V1 Groups  Label Class Group Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Add and Manage Tasks
      summary: Update a label class group
      description: Updates the prompt or multi-answer setting of an existing label class group.
      operationId: handler_update_label_class_group_labelClasses_public_v1_groups__label_class_group_id__patch
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: label_class_group_id
        in: path
        required: true
        schema:
          type: integer
          description: Label Class Group ID
          title: Label Class Group Id
        description: Label Class Group ID
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabelClassGroupRequest'
              examples:
              - prompt: prompt text
                multi_answer: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Update Label Class Group Labelclasses Public V1 Groups  Label Class Group Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Add and Manage Tasks
      summary: Get a label class group
      description: Returns details of a specific label class group, optionally including its answer classes.
      operationId: handler_get_label_class_group_labelClasses_public_v1_groups__label_class_group_id__get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: label_class_group_id
        in: path
        required: true
        schema:
          type: integer
          description: Label Class Group ID
          title: Label Class Group Id
        description: Label Class Group ID
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      - name: label_classes
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include label classes
          default: false
          title: Label Classes
        description: Whether to include label classes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLabelClassGroupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /labelClasses/public/v1/groups/{label_class_group_id}/answers:
    post:
      tags:
      - Add and Manage Tasks
      summary: Add existing answers to a label class group
      description: Adds existing answer classes to a label class group by their IDs.
      operationId: handler_add_existing_answers_to_label_class_group_labelClasses_public_v1_groups__label_class_group_id__answers_post
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: label_class_group_id
        in: path
        required: true
        schema:
          type: integer
          description: Label Class Group ID
          title: Label Class Group Id
        description: Label Class Group ID
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
              minItems: 1
              description: The label class IDs to add to the label class group
              title: Label Class Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Add Existing Answers To Label Class Group Labelclasses Public V1 Groups  Label Class Group Id  Answers Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Add and Manage Tasks
      summary: Delete answers from a label class group
      description: Answers will be ungrouped from the label class group but will not be deleted from the task
      operationId: handler_delete_answers_from_label_class_group_labelClasses_public_v1_groups__label_class_group_id__answers_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: label_class_group_id
        in: path
        required: true
        schema:
          type: integer
          description: Label Class Group ID
          title: Label Class Group Id
        description: Label Class Group ID
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
              minItems: 1
              description: The label class IDs to delete from the label class group
              title: Label Class Ids To Delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Delete Answers From Label Class Group Labelclasses Public V1 Groups  Label Class Group Id  Answers Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /labelClasses/public/v1/reorder:
    put:
      tags:
      - Add and Manage Tasks
      summary: Reorder the answers for a task
      description: Reorders the answer classes for a task by providing the desired order of answer IDs.
      operationId: handler_reorder_answers_labelClasses_public_v1_reorder_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderAnswersBody'
              examples:
              - task_id: 456
                new_answers_ids_order:
                - 0
                - 1
                - 2
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Reorder Answers Labelclasses Public V1 Reorder Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /labelClasses/public/v1/update:
    patch:
      tags:
      - Add and Manage Tasks
      summary: Update Label Classes
      description: Updates the name of an existing answer class on a task.
      operationId: update_label_classes_labelClasses_public_v1_update_patch
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnswerBody'
              examples:
              - answer: old_label
                new_answer: updated_label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLabelClassResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/public/v1/add:
    post:
      tags:
      - Add and Manage Tasks
      summary: Create a new task
      description: Creates a new task in the specified project with the given type, prompt, and answer classes.
      operationId: task_add_public_tasks_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/TaskClassification'
              - $ref: '#/components/schemas/TaskSegmentation'
              - $ref: '#/components/schemas/TaskRange'
              title: Body
              examples:
              - task_name: Image Classification
                project_id: 123
                task_prompt: Classify the medical condition in this image
                task_type: classification
                multi_answer: false
                answer_classes:
                - normal
                - abnormal
                - uncertain
                task_description: This task involves segmenting the liver, kidney, and heart.
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExistingTaskClassification'
                - $ref: '#/components/schemas/ExistingTaskSegmentation'
                - $ref: '#/components/schemas/ExistingTaskRange'
                title: Response Task Add Public Tasks Public V1 Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /tasks/public/v1/duplicate:
    post:
      tags:
      - Add and Manage Tasks
      summary: Duplicate an existing task
      description: Creates a copy of an existing task, optionally copying gold standards, labels, and tags.
      operationId: task_duplicate_tasks_public_v1_duplicate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateTaskFields'
              examples:
              - task_id: 123
                task_type: classification
                task_name: Copy of Original Task
                task_prompt: Classify the medical condition in this image
                copy_pre_answer_explainers: true
                copy_patches: true
                copy_gold_standards: true
                copy_internal_notes: true
                copy_explanations: true
                copy_tags: true
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateTaskResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /tasks/public/v1/get:
    get:
      tags:
      - Add and Manage Tasks
      summary: Retrieve information about a specific task
      description: Returns detailed information about a task by its ID.
      operationId: task_get_tasks_public_v1_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: The task ID
          title: Task Id
        description: The task ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExistingTaskClassification'
                - $ref: '#/components/schemas/ExistingTaskSegmentation'
                - $ref: '#/components/schemas/ExistingTaskRange'
                title: Response Task Get Tasks Public V1 Get Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/public/v1/instructions:
    post:
      tags:
      - Add and Manage Tasks
      summary: Set instructions for a task
      description: Create instruction slides for a task
      operationId: task_set_instructions_tasks_public_v1_instructions_post
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: The task ID
          title: Task Id
        description: The task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInstructionsRequest'
              examples:
              - slides:
                - <div>Welcome to this task!</div>
                - <div>Here are the instructions...</div>
                is_major_version: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/public/v1/list:
    get:
      tags:
      - Add and Manage Tasks
      summary: List your available tasks
      description: Returns a paginated list of tasks, optionally filtered by project, organization, or search term.
      operationId: task_list_tasks_public_v1_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: search_term
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: An optional search term to filter on
          title: Search Term
        description: An optional search term to filter on
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: The project ID
          title: Project Id
        description: The project ID
      - name: last_sequence_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: The paging token containing the last sequence ID from the previous page
          title: Last Sequence Id
        description: The paging token containing the last sequence ID from the previous page
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1000
            minimum: 1
            exclusiveMinimum: 0
          - type: 'null'
          description: The maximum number of results per page
          default: 100
          title: Limit
        description: The maximum number of results per page
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Organization ID for filtering
          title: Organization Id
        description: Organization ID for filtering
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/public/v1/set:
    patch:
      tags:
      - Add and Manage Tasks
      summary: Update an existing task
      description: Updates properties of an existing task such as name, prompt, answer classes, and labeling stage.
      operationId: task_update_public_tasks_public_v1_set_patch
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: The task ID
          title: Task Id
        description: The task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/UpdateTaskClassification'
              - $ref: '#/components/schemas/UpdateTask'
              examples:
              - task_name: Updated Task Name
                task_prompt: Updated task prompt for better clarity
                task_description: Updated description with additional details about the task.
              - task_name: Updated Task with Stage
                task_labeling_stage: open
                task_labeling_stage_note: Opening task for labeling
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - $ref: '#/components/schemas/ExistingTaskClassification'
                  - $ref: '#/components/schemas/ExistingTaskSegmentation'
                  - $ref: '#/components/schemas/ExistingTaskRange'
