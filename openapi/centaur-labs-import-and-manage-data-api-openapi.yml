openapi: 3.2.0
info:
  title: Ingest Import and Manage Data API
  description: Public API for importing data and managing labeling tasks, cases, projects, and assets.
  version: 0.1.0
servers:
- url: https://api.centaurlabs.com
tags:
- name: Import and Manage Data
  description: Import assets from cloud storage or URLs, and manage the resulting assets and file manifests.
paths:
  /assets/public/v1/add:
    post:
      tags:
      - Import and Manage Data
      summary: Shared Add Asset Override
      description: Create text asset
      operationId: shared_add_asset_override_assets_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextAssetRequestBase'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddAssetsResponse'
                - $ref: '#/components/schemas/MessageResponse'
                title: Response Shared Add Asset Override Assets Public V1 Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /assets/public/v1/get:
    get:
      tags:
      - Import and Manage Data
      summary: Shared Get Asset
      description: Get a specific asset from a project
      operationId: shared_get_asset_assets_public_v1_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: content_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Content Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseAsset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assets/public/v1/list:
    get:
      tags:
      - Import and Manage Data
      summary: Public List Assets
      description: List the existing assets for a specific project
      operationId: public_list_assets_assets_public_v1_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: last_sequence_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Last Sequence Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assets/public/v1/listSeries:
    post:
      tags:
      - Import and Manage Data
      summary: Shared List Series
      description: List series and study UUIDs for a specific project
      operationId: shared_list_series_assets_public_v1_listSeries_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAssetsFilters'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSeries'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /assets/public/v2/list:
    post:
      tags:
      - Import and Manage Data
      summary: Shared List Assets V2
      description: List and filter the existing assets for a specific project
      operationId: shared_list_assets_v2_assets_public_v2_list_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAssetsFiltersV2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /cases/public/v1/addImageFromFile:
    post:
      tags:
      - Import and Manage Data
      summary: Create Asset & Case From Image File
      description: Uploads an image file directly, creating an asset and a case in the specified task in one step.
      operationId: add_asset_and_case_from_file_cases_public_v1_addImageFromFile_post
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      - name: callback_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_asset_and_case_from_file_cases_public_v1_addImageFromFile_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAssetAndProblemCreationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/add:
    post:
      tags:
      - Import and Manage Data
      summary: Initiate an import
      description: Initiates a cloud storage import for a project by providing the source URI and target task IDs.
      operationId: add_import_imports_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddImportRequest'
              examples:
              - project_id: 123
                source_type: s3
                source_region: us-east-1
                uri: s3://my-bucket/path/to/data/
                name: Medical Images Import
                target_task_ids:
                - 456
                - 789
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /imports/public/v1/addAssetsFromURLs:
    post:
      tags:
      - Import and Manage Data
      summary: Initiate import from URLs
      description: Initiates an import of assets from a list of HTTPS URLs into a Centaur-hosted project.
      operationId: add_assets_from_urls_imports_public_v1_addAssetsFromURLs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssetsFromURLsRequest'
              examples:
              - project_id: 123
                urls:
                - https://example.com/image1.jpg
                - https://example.com/image2.jpg
                - https://example.com/image3.jpg
                target_task_ids:
                - 456
                - 789
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /imports/public/v1/delete:
    delete:
      tags:
      - Import and Manage Data
      summary: Delete an import, including its associated assets and cases
      description: Soft-deletes an import and all its associated assets and cases from a project.
      operationId: import_delete_imports_public_v1_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: import_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: The import ID
          title: Import Id
        description: The import ID
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: The project ID
          title: Project Id
        description: The project ID
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Import Delete Imports Public V1 Delete Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/get:
    get:
      tags:
      - Import and Manage Data
      summary: Fetch a specific import
      description: Returns details of a specific import by its ID, including status and file counts.
      operationId: get_import_public_imports_public_v1_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Project ID
          title: Project Id
        description: Project ID
      - name: import_id
        in: query
        required: true
        schema:
          type: integer
          description: Import ID
          title: Import Id
        description: Import ID
      - name: verbose
        in: query
        required: false
        schema:
          type: boolean
          description: Verbose output
          default: false
          title: Verbose
        description: Verbose output
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/list:
    get:
      tags:
      - Import and Manage Data
      summary: List imports
      description: Returns a list of imports, optionally filtered by project, organization, or content type.
      operationId: list_import_imports_public_v1_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Project ID
          title: Project Id
        description: Project ID
      - name: content_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Content type
          title: Content Type
        description: Content type
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Organization ID
          title: Organization Id
        description: Organization ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataImport'
                title: Response List Import Imports Public V1 List Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/policy/get:
    get:
      tags:
      - Import and Manage Data
      summary: Get Import Policy
      description: Get the required policy for the Centaur Importer to access the source data
      operationId: get_import_policy_imports_public_v1_policy_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: uri
        in: query
        required: true
        schema:
          type: string
          title: Uri
      - name: source_type
        in: query
        required: true
        schema:
          enum:
          - s3
          - gcs
          type: string
          title: Source Type
      - name: policy_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PolicyFormat'
          default: json
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Project Id
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootModel_Union_S3JsonPolicy__GCSJsonPolicy__UiLinkPolicy__CliCommandPolicy__CombinedPolicy__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/validateAccess:
    get:
      tags:
      - Import and Manage Data
      summary: Validate Access
      description: Verifies that the requested data source is accessible to the Centaur Importer
      operationId: validate_access_imports_public_v1_validateAccess_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: uri
        in: query
        required: true
        schema:
          type: string
          title: Uri
      - name: source_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CloudStoragePlatform'
      - name: source_region
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AWSRegion'
          - type: 'null'
          default: us-east-1
          title: Source Region
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Project Id
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateAccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /manifests/public/v1/add:
    post:
      tags:
      - Import and Manage Data
      summary: Add Files Manifest
      description: Updates series metadata (series ID, series index, view, notes) for a list of assets in a project.
      operationId: add_files_manifest_manifests_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilesManifestUpload'
              examples:
              - project_id: 123
                files_manifest:
                - content_id: 456
                  series: CT_Scan_001
                  series_index: 0
                  notes: Baseline scan
                  view: axial
                - content_id: 457
                  series: CT_Scan_001
                  series_index: 1
                  notes: Follow-up scan
                  view: axial
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestObject'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /manifests/public/v1/get:
    get:
      tags:
      - Import and Manage Data
      summary: Get Manifest
      description: Returns the files manifest (series metadata) for a project or import.
      operationId: get_manifest_manifests_public_v1_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Project ID
          title: Project Id
        description: Project ID
      - name: import_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Import ID
          title: Import Id
        description: Import ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestObject'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FilesManifestObject:
      properties:
        content_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Content Id
        origin:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin
        series:
          type: string
          minLength: 1
          title: Series
        series_index:
          type: integer
          title: Series Index
        view:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 1
          - type: 'null'
          title: View
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - series
      - series_index
      title: FilesManifestObject
    GCSBinding:
      properties:
        role:
          type: string
          title: Role
        members:
          items:
            type: string
          type: array
          title: Members
        condition:
          anyOf:
          - $ref: '#/components/schemas/GCSCondition'
          - type: 'null'
      type: object
      required:
      - role
      - members
      title: GCSBinding
    CombinedPolicy:
      properties:
        account:
          type: string
          title: Account
        link:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Link
        command:
          type: string
          title: Command
        json:
          anyOf:
          - $ref: '#/components/schemas/S3JsonPolicy'
          - $ref: '#/components/schemas/GCSJsonPolicy'
          title: Json
      type: object
      required:
      - account
      - link
      - command
      - json
      title: CombinedPolicy
    S3JsonPolicy:
      properties:
        Version:
          type: string
          title: Version
        Statement:
          items:
            $ref: '#/components/schemas/S3StatementItem'
          type: array
          title: Statement
      type: object
      required:
      - Version
      - Statement
      title: S3JsonPolicy
      example:
        Statement:
        - Action:
          - s3:ListBucket
          - s3:GetObject
          - s3:GetObjectTagging
          Effect: Allow
          Principal:
            AWS: arn:aws:iam::111122223333:role/example-role
          Resource: arn:aws:s3:::example-bucket/*
        Version: '2012-10-17'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ResponseAssetDICOM:
      properties:
        project_id:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
        content_id:
          type: integer
          exclusiveMinimum: 0
          title: Content Id
        origin:
          type: string
          title: Origin
        created_at:
          type: string
          title: Created At
        file_size:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: File Size
        import_id:
          type: integer
          exclusiveMinimum: 0
          title: Import Id
        imported_at:
          type: string
          title: Imported At
        related_tasks:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          title: Related Tasks
        related_cases:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          title: Related Cases
        tags:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
          title: Tags
        image_width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Image Width
        image_height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Image Height
        series:
          anyOf:
          - type: string
          - type: 'null'
          title: Series
        series_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Series Index
        study_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Study Uid
        series_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Series Uid
      type: object
      required:
      - project_id
      - content_id
      - origin
      - created_at
      - file_size
      - import_id
      - imported_at
      - related_tasks
      - related_cases
      - tags
      title: ResponseAssetDICOM
    Tag:
      properties:
        organization_id:
          type: integer
          title: Organization Id
        tag_id:
          type: integer
          title: Tag Id
        tag:
          type: string
          title: Tag
      type: object
      required:
      - organization_id
      - tag_id
      - tag
      title: Tag
    ResponseAssetText:
      properties:
        project_id:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
        content_id:
          type: integer
          exclusiveMinimum: 0
          title: Content Id
        origin:
          type: string
          title: Origin
        created_at:
          type: string
          title: Created At
        file_size:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: File Size
        import_id:
          type: integer
          exclusiveMinimum: 0
          title: Import Id
        imported_at:
          type: string
          title: Imported At
        related_tasks:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          title: Related Tasks
        related_cases:
          items:
            type: integer
            exclusiveMinimum: 0
          type: array
          title: Related Cases
        tags:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
          title: Tags
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        char_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Char Count
      type: object
      required:
      - project_id
      - content_id
      - origin
      - created_at
      - file_size
      - import_id
      - imported_at
      - related_tasks
      - related_cases
      - tags
      title: ResponseAssetText
    MessageResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: MessageResponse
    ListAssetsFiltersV2:
      properties:
        project_id:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
        last_sequence_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Last Sequence Id
        limit:
          type: integer
          exclusiveMinimum: 0
          title: Limit
          default: 100
        upload_id:
          anyOf:
          - $ref: '#/components/schemas/IntFilter'
          - type: 'null'
        imported_at:
          anyOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          - type: 'null'
        content_id:
          anyOf:
          - $ref: '#/components/schemas/IntFilter'
          - type: 'null'
        origin:
          anyOf:
          - $ref: '#/components/schemas/StrFilter'
          - type: 'null'
        study_uid:
          anyOf:
          - $ref: '#/components/schemas/StrFilter'
          - type: 'null'
        series_uid:
          anyOf:
          - $ref: '#/components/schemas/StrFilter'
          - type: 'null'
        series:
          anyOf:
          - $ref: '#/components/schemas/StrFilter'
          - type: 'null'
        series_index:
          anyOf:
          - $ref: '#/components/schemas/IntFilter'
          - type: 'null'
        char_count:
          anyOf:
          - $ref: '#/components/schemas/IntFilter'
          - type: 'null'
        customer_data_tag_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Customer Data Tag Id
        tag_text:
          anyOf:
          - type: string
          - type: 'null'
