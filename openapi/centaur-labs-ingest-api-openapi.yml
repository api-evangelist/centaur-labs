openapi: 3.1.0
info:
  title: Ingest API
  description: Public API for importing data and managing labeling tasks, cases, projects, and assets.
  version: 0.1.0
servers:
- url: https://api.centaurlabs.com
paths:
  /answers/public/v1/add:
    post:
      tags:
      - Add and Manage Tasks
      summary: Handler Add Answer Legacy
      description: 'Deprecated: use /labelClasses/public/v1/add instead. Adds answer classes to a task.'
      operationId: handler_add_answer_legacy_answers_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAnswerRequest'
              examples:
              - task_id: 456
                new_answers:
                - benign
                - malignant
                force: true
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LabelClassValueLegacy'
                type: array
                title: Response Handler Add Answer Legacy Answers Public V1 Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /answers/public/v1/delete:
    delete:
      tags:
      - Add and Manage Tasks
      summary: Handler Delete Answer Legacy
      description: 'Deprecated: use /labelClasses/public/v1/delete instead. Removes an answer class from a task.'
      operationId: handler_delete_answer_legacy_answers_public_v1_delete_delete
      deprecated: true
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      - name: answer
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 60
          title: Answer
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Delete Answer Legacy Answers Public V1 Delete Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /answers/public/v1/update:
    patch:
      tags:
      - Add and Manage Tasks
      summary: Update Label Classes
      description: Updates the name of an existing answer class on a task.
      operationId: update_label_classes_answers_public_v1_update_patch
      deprecated: true
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnswerBody'
              examples:
              - answer: old_label
                new_answer: updated_label
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLabelClassResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assets/public/v1/add:
    post:
      tags:
      - Import and Manage Data
      summary: Shared Add Asset Override
      description: Create text asset
      operationId: shared_add_asset_override_assets_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextAssetRequestBase'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AddAssetsResponse'
                - $ref: '#/components/schemas/MessageResponse'
                title: Response Shared Add Asset Override Assets Public V1 Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /assets/public/v1/get:
    get:
      tags:
      - Import and Manage Data
      summary: Shared Get Asset
      description: Get a specific asset from a project
      operationId: shared_get_asset_assets_public_v1_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: content_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Content Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseAsset'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assets/public/v1/list:
    get:
      tags:
      - Import and Manage Data
      summary: Public List Assets
      description: List the existing assets for a specific project
      operationId: public_list_assets_assets_public_v1_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: last_sequence_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Last Sequence Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assets/public/v1/listSeries:
    post:
      tags:
      - Import and Manage Data
      summary: Shared List Series
      description: List series and study UUIDs for a specific project
      operationId: shared_list_series_assets_public_v1_listSeries_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAssetsFilters'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSeries'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /assets/public/v2/list:
    post:
      tags:
      - Import and Manage Data
      summary: Shared List Assets V2
      description: List and filter the existing assets for a specific project
      operationId: shared_list_assets_v2_assets_public_v2_list_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAssetsFiltersV2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /cases/custom/v1/update:
    patch:
      tags:
      - Create and Manage Cases
      summary: Update Case
      description: Updates properties of an existing case, including answers, notes, explanations, and frame assets.
      operationId: update_problem_cases_custom_v1_update_patch
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: query_params
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/UpdateProblemRequest'
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseExistingProblem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            examples:
              problem_update_example:
                summary: Problem Update Example
                value:
                  problem_id: 123
                  problem_properties:
                    pre_answer_explainer: Updated explainer text
                    internal_notes: Updated internal notes
                    problem_explanation: Updated explanation
                  answers:
                  - new_option1
                  - new_option2
                  - new_option3
                  frames:
                  - frame_id: 1
                    frame_asset:
                    - view_order: 0
                      text_highlight:
                      - - 0
                        - 15
                      - - 25
                        - 40
  /cases/goldStandards/public/v1/set:
    patch:
      tags:
      - Add and Manage Labels
      summary: Set gold standard answers for a specific topic
      description: Sets gold standard answers for one or more cases in a task.
      operationId: set_gold_standards_override_cases_goldStandards_public_v1_set_patch
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
      - name: opinion_component_source
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/OpinionComponentSource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGoldStandardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetGoldStandardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/goldStandards/public/v1/unset:
    delete:
      tags:
      - Add and Manage Labels
      summary: Unset gold standards in a set of cases
      description: Removes gold standard answers from specified cases in a task, optionally preserving opinions.
      operationId: unset_gs_from_problems_cases_goldStandards_public_v1_unset_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
      - name: reads_action
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ReadsAction'
          - type: 'null'
          title: Reads Action
      - name: labeling_state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProblemLabelingState'
          default: ready
      - name: case_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
          minItems: 1
          unique_items: true
          title: Case Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Unset Gs From Problems Cases Goldstandards Public V1 Unset Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/prelabels/public/v1/set:
    put:
      tags:
      - Add and Manage Labels
      summary: Set prelabels for a specific topic
      description: Sets prelabel annotations for one or more cases in a task for segmentation and range task types.
      operationId: handler_set_prelabels_override_cases_prelabels_public_v1_set_put
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
      - name: opinion_component_source
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/OpinionComponentSource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPreLabelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/prelabels/public/v1/unset:
    delete:
      tags:
      - Add and Manage Labels
      summary: Unset prelabels in a set of cases
      description: Removes prelabel annotations from a specified set of cases in a task.
      operationId: handler_unset_prelabels_from_problems_cases_prelabels_public_v1_unset_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Project Id
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Task Id
      - name: case_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            exclusiveMinimum: 0
          minItems: 1
          unique_items: true
          title: Case Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Unset Prelabels From Problems Cases Prelabels Public V1 Unset Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/public/v1/addImageFromFile:
    post:
      tags:
      - Import and Manage Data
      summary: Create Asset & Case From Image File
      description: Uploads an image file directly, creating an asset and a case in the specified task in one step.
      operationId: add_asset_and_case_from_file_cases_public_v1_addImageFromFile_post
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          title: Task Id
      - name: callback_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_asset_and_case_from_file_cases_public_v1_addImageFromFile_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAssetAndProblemCreationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/public/v1/delete:
    delete:
      tags:
      - Create and Manage Cases
      summary: Delete a case from a task
      description: Deletes a specific case from a task by task ID and case ID.
      operationId: delete_case_cases_public_v1_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: task_id
        in: query
        required: true
        schema:
          type: integer
          description: Task ID
          title: Task Id
        description: Task ID
      - name: case_id
        in: query
        required: true
        schema:
          type: integer
          description: Case ID
          title: Case Id
        description: Case ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/public/v1/duplicate:
    post:
      tags:
      - Create and Manage Cases
      summary: Duplicate one or more cases from a task
      description: Duplicates cases from a source task into a target task, optionally copying gold standards and labels.
      operationId: handler_duplicate_case_cases_public_v1_duplicate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCaseFields'
              examples:
              - project_id: 123
                source_task_id: 789
                target_task_id: 101
                case_ids:
                - 201
                - 202
                copy_pre_answer_explainers: true
                copy_patches: true
                copy_gold_standards: true
                copy_internal_notes: true
                copy_explanations: true
                copy_tags: true
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Handler Duplicate Case Cases Public V1 Duplicate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /imports/public/api/v1/version:
    get:
      tags:
      - Version
      summary: Get Version
      description: Returns the current version of the Ingest API.
      operationId: get_version_imports_public_api_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /imports/public/v1/add:
    post:
      tags:
      - Import and Manage Data
      summary: Initiate an import
      description: Initiates a cloud storage import for a project by providing the source URI and target task IDs.
      operationId: add_import_imports_public_v1_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddImportRequest'
              examples:
              - project_id: 123
                source_type: s3
                source_region: us-east-1
                uri: s3://my-bucket/path/to/data/
                name: Medical Images Import
                target_task_ids:
                - 456
                - 789
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /imports/public/v1/addAssetsFromURLs:
    post:
      tags:
      - Import and Manage Data
      summary: Initiate import from URLs
      description: Initiates an import of assets from a list of HTTPS URLs into a Centaur-hosted project.
      operationId: add_assets_from_urls_imports_public_v1_addAssetsFromURLs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssetsFromURLsRequest'
              examples:
              - project_id: 123
                urls:
                - https://example.com/image1.jpg
                - https://example.com/image2.jpg
                - https://example.com/image3.jpg
                target_task_ids:
                - 456
                - 789
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - BearerToken: []
  /imports/public/v1/delete:
    delete:
      tags:
      - Import and Manage Data
      summary: Delete an import, including its associated assets and cases
      description: Soft-deletes an import and all its associated assets and cases from a project.
      operationId: import_delete_imports_public_v1_delete_delete
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: import_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: The import ID
          title: Import Id
        description: The import ID
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          description: The project ID
          title: Project Id
        description: The project ID
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Import Delete Imports Public V1 Delete Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/get:
    get:
      tags:
      - Import and Manage Data
      summary: Fetch a specific import
      description: Returns details of a specific import by its ID, including status and file counts.
      operationId: get_import_public_imports_public_v1_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Project ID
          title: Project Id
        description: Project ID
      - name: import_id
        in: query
        required: true
        schema:
          type: integer
          description: Import ID
          title: Import Id
        description: Import ID
      - name: verbose
        in: query
        required: false
        schema:
          type: boolean
          description: Verbose output
          default: false
          title: Verbose
        description: Verbose output
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/list:
    get:
      tags:
      - Import and Manage Data
      summary: List imports
      description: Returns a list of imports, optionally filtered by project, organization, or content type.
      operationId: list_import_imports_public_v1_list_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Project ID
          title: Project Id
        description: Project ID
      - name: content_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Content type
          title: Content Type
        description: Content type
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          description: Organization ID
          title: Organization Id
        description: Organization ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataImport'
                title: Response List Import Imports Public V1 List Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /imports/public/v1/policy/get:
    get:
      tags:
      - Import and Manage Data
      summary: Get Import Policy
      description: Get the required policy for the Centaur Importer to access the source data
      operationId: get_import_policy_imports_public_v1_policy_get_get
      security:
      - APIKeyHeader: []
      - BearerToken: []
      parameters:
      - name: uri
        in: query
        required: true
        schema:
          type: string
          title: Uri
      - name: source_type
        in: query
        required: true
        schema:
          enum:
          - s3
          - gcs
          type: string
          title: Source Type
      - name: policy_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PolicyFormat'
          default: json
      - name: project_id
