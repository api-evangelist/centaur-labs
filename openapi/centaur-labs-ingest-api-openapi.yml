components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProblemLabelingState:
      type: string
      enum:
      - canceled
      - user_flagged
      - active
      - qa
      - silver_standard
      - unresolved
      - ignore
      - ready
      - done
      - on_deck
      - ready_gold_standard
      - gold_standard
      title: ProblemLabelingState
      description: 'The labeling states a problem can be in.


        games.labeling_states also carries a `tutorial` row, which is retired and deliberately

        not modelled here. The sync test asserts it is the only such state, so a genuinely new

        one fails CI rather than going unnoticed.'
    ReadsAction:
      type: string
      enum:
      - wipe
      - preserve
      title: ReadsAction
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    GoldStandardClassification:
      properties:
        notes:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Notes
        case_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Case Id
        content_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Content Id
        origin:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Origin
        answer:
          items:
            type: string
            maxLength: 60
            minLength: 1
          type: array
          title: Answer
          unique_items: true
      type: object
      required:
      - answer
      title: GoldStandardClassification
    GoldStandardRange:
      properties:
        notes:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Notes
        case_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Case Id
        content_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Content Id
        origin:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Origin
        answer:
          items:
            $ref: '#/components/schemas/RangeAnswer'
          type: array
          title: Answer
          unique_items: true
      type: object
      required:
      - answer
      title: GoldStandardRange
    GoldStandardSegmentation:
      properties:
        notes:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Notes
        case_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Case Id
        content_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Content Id
        origin:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Origin
        answer:
          items:
            $ref: '#/components/schemas/SegmentationAnswer'
          type: array
          title: Answer
          unique_items: true
      type: object
      required:
      - answer
      title: GoldStandardSegmentation
    GoldStandardUUID:
      properties:
        notes:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Notes
        case_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Case Id
        content_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Content Id
        origin:
          anyOf:
          - type: string
            maxLength: 250
            minLength: 1
          - type: 'null'
          title: Origin
        answer:
          items:
            $ref: '#/components/schemas/UUIDAnswer'
          type: array
          title: Answer
          unique_items: true
      type: object
      required:
