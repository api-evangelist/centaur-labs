      title: GoldStandardUUID
    OpinionComponentSource:
      type: string
      enum:
      - mi
      - ma
      - wp
      - wo
      - ir
      - pri
      - pub
      - sql
      - un
      title: OpinionComponentSource
    RangeAnswer:
      properties:
        answer_class:
          type: string
          title: Answer Class
        ranges:
          items:
            items:
              type: integer
              minimum: 0
            type: array
            maxItems: 2
            minItems: 2
          type: array
          minItems: 1
          title: Ranges
        freetexts:
          anyOf:
          - items:
              anyOf:
              - items:
                  type: string
                type: array
                unique_items: true
              - type: 'null'
            type: array
