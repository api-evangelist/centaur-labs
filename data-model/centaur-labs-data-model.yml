api: Centaur Public API
entities:
- name: Project
  description: A collection of data assets to be labeled, owned by an organization.
- name: Task
  description: A labeling task within a project (type, prompt, answer classes, stage).
- name: Case
  description: A unit of work pairing an asset with a task; carries answers/opinions.
- name: Asset
  description: A single piece of imported content (image, text, audio, video, DICOM).
- name: Series
  description: A grouping of related assets (e.g. DICOM series / study).
- name: Import
  description: A batch ingestion of assets from cloud storage or URLs.
- name: Manifest
  description: Series metadata (series ID/index, view, notes) for a project's assets.
- name: LabelClass
  description: 'An answer class (choice) available on a task. Legacy alias: Answer.'
- name: LabelClassGroup
  description: A named grouping of label classes on a task.
- name: GoldStandard
  description: Reference-truth answers set on cases for quality measurement.
- name: Prelabel
  description: Pre-populated segmentation/range annotations on cases.
- name: Tag
  description: A label applied to cases for organization/filtering.
- name: Read
  description: An individual opinion (annotation) submitted on a case.
- name: Result
  description: Aggregated labeling output for a case.
- name: Mask
  description: Uploaded DICOMSEG/TIFF segmentation mask attached to a case.
