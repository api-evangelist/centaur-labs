aid: centaur-labs
name: Centaur Labs
description: >-
  Centaur Labs (centaur.ai) provides expert data annotation and labeling for
  healthcare and scientific AI. Its platform combines large crowds of vetted
  human experts with AI models in a competitive "collective intelligence" model
  to produce high-quality, aggregated training labels across images, text,
  audio, video, waveform and DICOM medical imaging. Centaur exposes a public
  REST API (api.centaurlabs.com) for importing data, creating and managing
  labeling projects, tasks, cases, gold standards, tags and prelabels, and for
  downloading aggregated results. The company is SOC 2 Type II audited and
  HIPAA compliant, was founded by Erik Duhaime out of the MIT Center for
  Collective Intelligence, and is backed by Accel and Matrix Partners.
